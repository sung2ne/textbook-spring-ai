spring:
  application:
    name: spring-ai
  profiles:
    active: dev  # 개발: dev, 운영: prod

  datasource:
    url: jdbc:postgresql://localhost:5432/springai
    username: springai
    password: springai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
      connect-timeout: 10s
      read-timeout: 60s
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
    com.example.springai: DEBUG
