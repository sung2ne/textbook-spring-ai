spring:
  application:
    name: spring-ai
  profiles:
    active: dev  # 개발: dev, 운영: prod

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
      connect-timeout: 10s
      read-timeout: 60s

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
    com.example.springai: DEBUG
